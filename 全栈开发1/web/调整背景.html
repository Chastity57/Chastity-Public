<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>背景图位置微调 · 全栈开发1</title>
<link rel="stylesheet" href="styles.css" />
<style>
  /* 这个页面只用于调参，样式独立，不影响登录页 */
  body { align-content: center; }
  .tuner { grid-area: auto; width: 100%; max-width: 1000px; }
  .tuner .card { padding: 22px; }
  .tuner h2 { margin: 0 0 4px; font-size: 1.25rem; letter-spacing: -0.02em; color: var(--g-800); }
  .tuner p.tip { margin: 0 0 16px; font-size: 0.8125rem; color: var(--ink-soft); }
  .layout { display: grid; grid-template-columns: 1fr; gap: 16px; }
  @media (min-width: 900px) { .layout { grid-template-columns: 260px 1fr; } }
  .controls { display: grid; gap: 14px; align-content: start; }
  .ctl { display: grid; gap: 6px; font-size: 0.8125rem; color: var(--ink-soft); }
  .ctl output { font-variant-numeric: tabular-nums; color: var(--g-800); font-weight: 600; }
  input[type="range"] { width: 100%; accent-color: var(--g-700); }
  .preview {
    position: relative;
    border-radius: var(--radius-control);
    border: 1px solid var(--glass-border);
    overflow: hidden;
    background: rgba(255, 255, 255, 0.12);
  }
  .preview iframe { display: block; width: 100%; height: 480px; border: 0; }
  .code {
    margin: 0;
    padding: 12px 14px;
    border-radius: var(--radius-control);
    border: 1px solid var(--glass-border);
    background: rgba(255, 255, 255, 0.2);
    font-family: ui-monospace, "Cascadia Mono", Consolas, monospace;
    font-size: 0.75rem;
    line-height: 1.6;
    color: var(--g-700);
    white-space: pre-wrap;
  }
  .tuner .form__actions { margin-top: 0; }
</style>
</head>
<body>

<main class="shell tuner">
  <section class="card">
    <h2>背景图位置微调</h2>
    <p class="tip">拖动滑块，右侧预览会立刻更新；满意后把下面的三行填回 <b>web/styles.css</b> 里的同名变量即可。这只是调参工具，删掉本文件不影响登录页。</p>

    <div class="layout">
      <div class="controls">
        <label class="ctl">
          <span>左右移动 <output id="outShift">-24%</output></span>
          <input type="range" id="shift" min="-30" max="30" step="0.5" value="-24" />
        </label>
        <label class="ctl">
          <span>上下位置 <output id="outPosY">20%</output></span>
          <input type="range" id="posy" min="0" max="100" step="1" value="20" />
        </label>
        <label class="ctl">
          <span>缩放（放大才有平移余量） <output id="outZoom">1.5</output></span>
          <input type="range" id="zoom" min="1" max="2" step="0.01" value="1.5" />
        </label>
        <p class="tip" id="hint"></p>
        <div class="form__actions">
          <button class="button button--primary" type="button" id="copy">复制这三行</button>
          <a class="button button--ghost" href="index.html" target="_blank" rel="noopener" style="text-decoration:none">打开登录页</a>
        </div>
      </div>

      <div>
        <div class="preview"><iframe id="stage" src="index.html" title="登录页预览"></iframe></div>
        <pre class="code" id="code"></pre>
      </div>
    </div>
  </section>
</main>

<script>
const stage = document.getElementById('stage');
const shift = document.getElementById('shift');
const posy  = document.getElementById('posy');
const zoom  = document.getElementById('zoom');
const outShift = document.getElementById('outShift');
const outPosY  = document.getElementById('outPosY');
const outZoom  = document.getElementById('outZoom');
const hint = document.getElementById('hint');
const code = document.getElementById('code');

function apply() {
  const s = Number(shift.value);
  const y = Number(posy.value);
  const z = Number(zoom.value);
  const limit = (z - 1) / 2 * 100;          // 平移上限，超过会长出白边
  let warning = '';
  if (Math.abs(s) > limit) {
    warning = `当前缩放只允许左移最多 ${limit.toFixed(1)}%，再大就会露出边缘——把缩放一起调大即可。`;
  } else if (limit - Math.abs(s) < 0.6) {
    warning = `已经贴着上限了（${limit.toFixed(1)}%），想要更多请同时调大缩放。`;
  }
  outShift.value = s + '%';
  outPosY.value = y + '%';
  outZoom.value = z.toFixed(2);
  hint.textContent = warning;
  code.textContent =
    `  --bg-zoom: ${z.toFixed(2)};\n  --bg-shift-x: ${s}%;\n  --bg-pos-y: ${y}%;`;
  try {
    const root = stage.contentDocument.documentElement;
    root.style.setProperty('--bg-zoom', z);
    root.style.setProperty('--bg-shift-x', s + '%');
    root.style.setProperty('--bg-pos-y', y + '%');
  } catch (err) {
    hint.textContent = '无法预览：请通过 http://127.0.0.1:8080/调整背景.html 打开（而不是双击文件）。';
  }
}

[shift, posy, zoom].forEach((el) => el.addEventListener('input', apply));
document.getElementById('copy').addEventListener('click', async () => {
  try { await navigator.clipboard.writeText(code.textContent); hint.textContent = '已复制这三行。'; }
  catch { hint.textContent = '复制失败，手动选中下面的三行即可。'; }
});
stage.addEventListener('load', apply);
apply();
</script>
</body>
</html>
